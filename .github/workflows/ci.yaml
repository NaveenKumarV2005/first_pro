
name: Deploy Calculator

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build:
    name: Test Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          python -m pytest tests/test.py -v

  docker:
    name: Build and Test Docker
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t python-calculator:latest .

      - name: Run Docker Container
        run: |
          docker run -d \
            --name calculator-app \
            -p 8000:8000 \
            python-calculator:latest

      - name: Wait for Application
        run: sleep 5

      - name: Test Health API
        run: |
          curl --fail http://localhost:8000/health

      - name: Test Frontend
        run: |
          curl --fail http://localhost:8000/ | grep -q "Calc Pro"

      - name: Test Calculator API
        run: |
          curl --fail -X POST http://localhost:8000/calculate \
            -H "Content-Type: application/json" \
            -d '{"num1":20,"num2":10,"operation":"add"}' \
            | grep -q '"result":30.0'

      - name: Container Logs
        if: always()
        run: docker logs calculator-app || true

      - name: Stop Container
        if: always()
        run: docker rm -f calculator-app || true
  python:
    name: python runner
    needs: docker
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
      
      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: running
        run: python -m /app/main.py