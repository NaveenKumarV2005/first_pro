name: Deploy Calculator

on:
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: checkout
              uses: actions/checkout@v3
            
            - name: setup python
              uses: actions/Python@v4
              with:
                  python-version: 3.11
            
            - name: install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
            
            - name: run tests
              run: pytest

            
